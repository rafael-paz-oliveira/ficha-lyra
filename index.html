<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha Fabula Ultima</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1320">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho fixo com recursos, abas, e grade de cartões que reflui entre desktop e tablet. */
:root{
  --bg:#0e1320; --panel:#161d2f; --panel2:#1d2640; --line:#2b3654;
  --text:#ebe6d9; --muted:#97a1b8; --brass:#d6a84e; --brass2:#f0cf84;
  --pv:#e0675f; --pm:#6aa7e6; --pi:#e4b94f; --good:#5cc08c; --bad:#e0605a;
  --display:'Cinzel','Trajan Pro',Georgia,serif;
  --body:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-bottom:140px}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.04em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

#top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#121a2c,#0e1424);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.who{display:flex;align-items:center;gap:10px;min-width:180px;flex:0 1 auto}
.who img{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:2px solid var(--brass)}
.who b{font-family:var(--display);font-size:20px;color:var(--brass2);display:block;line-height:1.1}
.who .ver{font-family:system-ui,sans-serif;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:middle;letter-spacing:.3px}
.who small{color:var(--muted)}
.res{display:flex;gap:8px;flex:1 1 380px;min-width:0}
.rt{flex:1 1 0;min-width:96px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px 8px;text-align:left;cursor:pointer;min-height:56px;position:relative;overflow:hidden}
.pmq{flex:none;width:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--pm);font-weight:700;font-size:15px;cursor:pointer}.pmq:active:not(:disabled){background:var(--pm);color:#0b1220}.pmq:disabled{opacity:.35;cursor:default}
.piq{flex:none;width:46px;display:flex;flex-direction:column;gap:4px}.piq button{flex:1;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--pi);font-weight:700;font-size:18px;cursor:pointer;padding:0;min-height:26px}.piq.pv button{color:var(--pv)}.piq.pv button:active:not(:disabled){background:var(--pv);color:#1a0a0a}
.piq.pm button{color:var(--pm);font-size:14px}.piq.pm button:active:not(:disabled){background:var(--pm);color:#0b1220}
.piq button:active:not(:disabled){background:var(--pi);color:#1a1408}.piq button:disabled{opacity:.35;cursor:default}
@media(max-width:560px){.res{gap:4px}.rt{min-width:60px;padding:6px 6px 8px}.rt .v{font-size:17px;white-space:nowrap}.rt .v small{font-size:10px}.piq{width:34px}}
.rt:hover{border-color:var(--brass)}
.rt .k{font-size:11px;letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between}
.rt .v{font-size:22px;font-weight:700;line-height:1.15}
.rt .v small{font-size:13px;color:var(--muted);font-weight:500}
.bar{height:5px;border-radius:3px;background:#0a0f1b;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .25s}
.rt.pv .v{color:var(--pv)} .rt.pv i{background:var(--pv)}
.rt.pm .v{color:var(--pm)} .rt.pm i{background:var(--pm)}
.rt.pi{flex:0 0 auto;min-width:78px}.rt.pi .v{color:var(--pi)} .rt.pi i{background:var(--pi)}
.rt.crisis{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.rt.crisis .k::after{content:"CRISE";color:var(--bad);font-weight:700}
.rt.ko .k::after{content:"CAÍDA"}
.side{display:flex;gap:8px;align-items:stretch}
.pfbox{display:flex;gap:4px;align-items:stretch}
.pft{min-width:64px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px 10px;border-radius:10px;border:2px solid var(--brass);background:linear-gradient(180deg,rgba(212,168,67,.22),rgba(212,168,67,.06));box-shadow:0 0 12px rgba(212,168,67,.28)}
.pft .k{font-size:11px;letter-spacing:.14em;color:var(--brass2);font-weight:700}.pft .v{font-size:30px;font-weight:700;color:var(--brass2);line-height:1.05;font-family:var(--display)}
.piq.pfq button{color:var(--brass2);border-color:var(--brass)}.piq.pfq button:active:not(:disabled){background:var(--brass);color:#1a1408}
.pf{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.pf .k{font-size:11px;letter-spacing:.1em;color:var(--muted);text-align:center}
.pf .v{font-size:22px;font-weight:700;color:var(--brass2);min-width:28px;text-align:center}
.zen{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left}
.zen:hover{border-color:var(--brass)}
.zen .k{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.zen .v{font-size:18px;font-weight:700;color:var(--brass2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--good)} .dot.err{background:var(--bad)} .dot.wait{background:var(--pi)}

#tabs{position:sticky;top:var(--hh,84px);z-index:15;display:flex;gap:4px;overflow-x:auto;padding:6px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:0 0 auto;min-height:44px;padding:0 18px;border:1px solid transparent;border-radius:8px;background:none;color:var(--muted);cursor:pointer;font-weight:600}
#tabs button.on{background:var(--panel2);color:var(--brass2);border-color:var(--line)}
#tabs button:hover{color:var(--text)}

main{padding:14px 16px;max-width:1500px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;grid-column:span 12;min-width:0}
.colstack .defs{grid-template-columns:repeat(4,1fr)}.colstack .attrs{grid-template-columns:repeat(4,1fr)}.colstack .dt{padding:8px}.colstack .dt b{font-size:20px}
@media(max-width:560px){.colstack .defs,.colstack .attrs{grid-template-columns:repeat(2,1fr)}}
.colstack{display:flex;flex-direction:column;gap:14px;align-self:start}.colstack>.card{margin:0}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}
@media(max-width:1000px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media(min-width:1001px) and (max-width:1250px){.s4{grid-column:span 6}}
.card>h2{font-size:15px;color:var(--brass);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3{font-size:13px;color:var(--brass2);margin:12px 0 6px}
.lbl{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 140px;min-width:0}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}.pc{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}.pc .pv{min-height:46px;display:flex;align-items:center}.lvbig{font-family:var(--display);font-size:34px;color:var(--brass2);line-height:1}
.pc .note{font-size:12px;margin:0}
.defs.four{grid-template-columns:repeat(4,1fr);gap:8px}.defs.four .dt{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:10px;min-height:68px}.defs.four .dt b{font-size:24px}
@media(max-width:560px){.prog{grid-template-columns:1fr 1fr}.defs.four{grid-template-columns:1fr 1fr}}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

.f{width:100%;min-height:44px;background:#0d1322;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.f:focus{border-color:var(--brass);box-shadow:0 0 0 2px rgba(214,168,78,.25)}
textarea.f{resize:vertical;line-height:1.45;min-height:44px;overflow:hidden}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.f.n{text-align:center;max-width:90px}
.f.sm{min-height:38px;padding:5px 8px;font-size:14px}
select.f{appearance:auto}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brass);color:#1a1408;border-color:var(--brass)}
.btn.pri:hover{background:var(--brass2)}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn.ico{width:44px;padding:0;font-size:20px;line-height:1}
.btn.ghost{background:none}
:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}

.step{display:inline-flex;align-items:center;gap:2px;background:#0d1322;border:1px solid var(--line);border-radius:8px}
.step button{width:40px;min-height:42px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--brass2)}
.step button:hover{background:var(--panel2)}
.step b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}

.ident{display:flex;gap:14px}
.portrait{flex:0 0 150px;position:relative}
.portrait img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;border:2px solid var(--brass);display:block;cursor:pointer}
.portrait small{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:4px}
.ident .fields{flex:1}
@media(max-width:560px){.ident{flex-direction:column}.portrait{flex-basis:auto;width:150px}}

.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.at{background:#0f1628;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.at .nm{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.at .die{font-family:var(--display);font-size:38px;font-weight:700;color:var(--brass2);line-height:1.1}
.at .die.low{color:var(--bad)}
.dierow{display:flex;align-items:center;justify-content:center;gap:6px}.dierow .die{min-width:62px}
.dbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#0d1322;color:var(--text);font-size:20px;cursor:pointer;flex:none}
.dbtn:disabled{opacity:.3;cursor:default}.dbtn:active:not(:disabled){background:var(--brass);color:#1a1408}
.colstack .dbtn{width:32px;height:32px;font-size:18px}.colstack .dierow{gap:3px}.colstack .dierow .die{min-width:0;font-size:32px}
.at .base{font-size:12px;color:var(--muted)}
.at select{margin-top:6px;min-height:38px}
.cond{display:flex;flex-wrap:wrap;gap:14px 34px;margin-top:6px}
.cgrp{display:grid;grid-template-columns:auto 34px auto;align-items:center;color:var(--muted)}
.cgrp .cl{display:flex;flex-direction:column;gap:8px}.cgrp .brk{width:34px;height:100%;min-height:60px}
.cd{min-height:40px}.cd small{color:var(--muted);font-size:11px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#0f1628;cursor:pointer;font-weight:600;color:var(--muted)}
.chip small{font-weight:400;opacity:.8}
.chip.eq{background:var(--brass);border-color:var(--brass);color:#1a1408}
.chip.on{background:rgba(224,96,90,.18);border-color:var(--bad);color:#ffb4ae}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.dt{flex-wrap:wrap;background:#0f1628;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dt b{font-size:26px;color:var(--brass2);font-family:var(--display)}
.dt span{font-size:11px;letter-spacing:.1em;color:var(--muted)}
details.hab{margin-top:8px}
details.ref{margin-top:8px}
details.ref summary{color:var(--text)}
details.ref[open]{border-style:solid}
details{margin-top:12px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
summary{cursor:pointer;color:var(--muted);min-height:32px;display:flex;align-items:center}
.adj{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}

.bond{display:grid;grid-template-columns:minmax(80px,.7fr) repeat(3,minmax(0,1.5fr)) 52px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.bond:last-child{border:0}
.simrow{padding:10px 0;border-bottom:1px solid var(--line)}.simrow:last-child{border:0}
.simname{display:flex;gap:8px;align-items:center;margin-bottom:6px}.tok{border-radius:50%;object-fit:cover;vertical-align:middle;flex:none}.tok.none{display:inline-block;border:1px dashed var(--line);background:#0d1322;border-radius:50%}
.tokbtn{background:none;border:0;padding:0;cursor:pointer;flex:none;line-height:0}
.simbtns .pair button{display:flex;align-items:center;justify-content:center;gap:6px}
.tokgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.tokgrid button{background:#0f1628;border:1px solid var(--line);border-radius:10px;padding:6px 2px;color:var(--text);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.simname .chip{flex:none;min-height:40px;font-size:13px;padding:0 12px}.simname .f{flex:1 1 auto;min-width:0}.simname .f{background:transparent;border-color:transparent;font-weight:700;font-size:17px;color:var(--brass2);padding-left:2px;cursor:text}.simname .f:focus{background:var(--bg2,#0c1322);border-color:var(--brass2);padding-left:12px;color:var(--text)}.simname .f::placeholder{font-weight:400;font-size:15px;color:var(--muted)}
.simbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.simbtns .pair{min-width:0}.simbtns .pair button{white-space:normal;font-size:13px;padding:4px 6px;line-height:1.2}
.pair{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pair button{flex:1 1 0;min-width:0;min-height:42px;border:0;background:#0d1322;color:var(--muted);cursor:pointer;font-size:11.5px;padding:0 2px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.pair button+button{border-left:1px solid var(--line)}
.pair button.on{background:var(--brass);color:#1a1408;font-weight:700}
.pair button.on.neg{background:#8c3a36;color:#fff}
.bhead{display:grid;grid-template-columns:minmax(80px,.7fr) repeat(3,minmax(0,1.5fr)) 52px;gap:6px;font-size:11px;letter-spacing:.1em;color:var(--muted);text-align:center;padding-bottom:4px}
.bhead span:first-child{text-align:left}
.bforce{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;font-weight:700;color:var(--brass2);line-height:1}.bforce.z{color:var(--muted);opacity:.5}
@media(max-width:700px){.bond,.bhead{grid-template-columns:1fr 1fr 1fr}.bond>.f{grid-column:1/-1}.bhead span:first-child{display:none}}

.cls{border:1px solid var(--line);border-radius:10px;padding:10px;background:#12192c;margin-bottom:10px}
.cls .nameRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pw{margin-top:8px;display:grid;gap:6px}
.pwr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pwr .f.name{flex:1 1 150px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--panel2);font-size:12px;color:var(--muted)}
.tag.ok{color:var(--good)} .tag.warn{color:var(--pi)}

.item{border:1px solid var(--line);border-radius:10px;padding:10px;background:#12192c;margin-bottom:10px}
.item.eq{border-color:var(--brass)}
.item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.item .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.wsum{margin-top:8px}.wsum .wb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wsum .wbox{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.wsum .wbox small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}.wsum .wbox b{display:block;font-size:18px;color:var(--brass2);margin-top:2px;overflow-wrap:anywhere}.wsum .wt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.wsum .wsub{display:block;font-size:13px;color:var(--muted);margin-top:2px}.wsum .wt .tag{font-size:13px;padding:4px 10px}.wsum .wn.wnote{font-size:15px;line-height:1.5;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:10px;border-left:3px solid var(--brass)}
.wsum .wn{margin-top:8px;color:var(--text);font-size:13px;white-space:pre-wrap}
@media(max-width:560px){.wsum .wb{grid-template-columns:1fr}}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.hhead h3{margin:0}
.precbox{margin-top:8px}.precbox .lbl{display:flex;gap:8px;align-items:baseline}.precv{color:var(--brass2);font-size:16px}
.precrow{display:grid;grid-template-columns:1fr 1fr 118px;gap:8px;align-items:end;margin-top:4px}.precrow .mod{display:flex;flex-direction:column;gap:3px}
@media(max-width:560px){.precrow{grid-template-columns:1fr 1fr}.precrow .mod{grid-column:1/-1}}
.cbon{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.slot{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:6px}
.item .stats.wide{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.item .stats.wide input{font-size:16px;font-weight:600}
.item .stats label{display:flex;flex-direction:column;gap:3px}
.tgl{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;user-select:none;font-weight:600}
.tgl input{width:22px;height:22px;accent-color:var(--brass)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.clock{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.clock svg{flex:0 0 120px}
.clock .fields{flex:1;min-width:200px}

.ses{padding:0}.ses>summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none;min-height:48px}.ses>summary::-webkit-details-marker{display:none}
.ses>summary::before{content:"▸";color:var(--brass);font-size:14px;transition:transform .15s}.ses[open]>summary::before{transform:rotate(90deg)}
.ses .sd{color:var(--muted);font-size:13px;white-space:nowrap}.ses .st{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ses .tag{white-space:nowrap;flex:none}.ses .sbody{padding:0 14px 14px}
.diary .f.date{max-width:170px}

.condmag{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-start}.condcol{flex:0 0 370px;max-width:100%}.magcol{flex:1 1 200px;min-width:200px}.magbtn{width:100%;min-height:48px;font-size:16px}.magsel{display:grid;grid-template-columns:1fr;gap:8px}.magcol .out{margin-top:8px}.magcol .out .cost{font-size:22px}
.npv{color:var(--brass2);font-weight:600}.npv b{color:var(--text)}.npbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.npchip{font-size:13px;padding:4px 10px}.npchip b{color:var(--brass2)}
.bld{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.out{margin-top:10px;background:#0f1628;border:1px solid var(--brass);border-radius:10px;padding:12px}
.out .cost{font-family:var(--display);font-size:24px;color:var(--pm)}
.out p{margin:6px 0;white-space:pre-wrap}
.out b.k{color:var(--brass2)}
table.ref td.rk{font-weight:600;color:var(--brass2);white-space:nowrap;padding-right:12px;vertical-align:top}table.ref td{vertical-align:top;padding:6px 6px}table.ref.tests td.rk{white-space:normal;color:var(--text);font-weight:400}table.ref.tests td:last-child{white-space:nowrap;text-align:right;color:var(--brass2)}.reflist{margin:6px 0 0;padding-left:18px}.reflist li{margin:4px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11px;letter-spacing:.1em;color:var(--muted);text-align:left;font-weight:600;padding:4px 6px}
table.t td{padding:3px 4px;border-top:1px solid var(--line)}
.scroll{overflow-x:auto}

.hist{display:grid;gap:6px;margin-top:10px}
.hi{display:flex;justify-content:space-between;gap:10px;background:#0f1628;border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex-wrap:wrap}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px 12px;pointer-events:none}
#dock>div{pointer-events:auto;background:#101830;border:1px solid var(--brass);border-radius:14px;padding:12px 16px;box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:640px;width:100%;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dice{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dc{min-width:46px;height:46px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:21px;line-height:1}
.dc small{font-size:10px;color:var(--muted);font-weight:500}
.dc.hi{border-color:var(--brass2);color:var(--brass2)}
.tot{font-family:var(--display);font-size:34px;color:var(--brass2);line-height:1}
.badge{padding:2px 8px;border-radius:6px;font-size:12px;font-weight:800;letter-spacing:.08em}
.badge.crit{background:var(--good);color:#06150d}
.badge.fumb{background:var(--bad);color:#fff}
.dmg{border-left:2px solid var(--line);padding-left:14px}

#modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden],#dock[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.mbox.wide{max-width:760px}.mbox .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.mbox .mtop h2{margin:0}.fixbar{grid-column:1/-1;position:sticky;top:calc(var(--hh,84px) + var(--th,46px) + 6px);z-index:12;display:flex;flex-wrap:wrap;gap:8px 12px;padding:8px;background:#121a2c;border:1px solid var(--brass);border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.fstats{display:grid;grid-template-columns:repeat(4,minmax(62px,1fr));gap:6px;flex:1 1 300px}
.fchip{background:#0f1628;border:1px solid var(--line);border-radius:10px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fchip small{font-size:10px;letter-spacing:.1em;color:var(--muted)}.fchip b{font-size:22px;color:var(--brass2);font-family:var(--display);line-height:1.1}
.fdice{display:grid;grid-template-columns:repeat(4,minmax(92px,1fr));gap:6px;flex:2 1 440px}
.fixbar .at{padding:4px 6px}.fixbar .at .nm{font-size:10px}.fixbar .at .die{font-size:26px;min-width:38px}.fixbar .dbtn{width:30px;height:30px;font-size:17px}.fixbar .dierow{gap:4px}
.confbar{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}.confbar .btn{flex:1 1 160px;min-height:46px;font-size:15px}
.tompick{display:flex;flex-direction:column;gap:8px}.tombtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;margin:0;width:100%;color:var(--text);font:inherit}.tombtn b{color:var(--brass2);font-size:16px}.tombtn span{color:var(--muted);font-size:13px}.tombtn:hover,.tombtn:active{border-color:var(--brass)}
.mbox h3{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;color:var(--brass2)}
.mbox h2{font-size:17px;color:var(--brass2);margin-bottom:10px}
.resform{display:grid;gap:10px;margin:12px 0}.rf{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center}.rf span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.rf input{min-height:46px;font-size:20px;text-align:center}.rf .btn{min-height:46px;min-width:96px}
.presets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.presets button{min-height:46px}
.menu{display:grid;gap:8px}
.big{font-family:var(--display);font-size:34px;text-align:center}
.mrow{display:flex;gap:8px;margin-top:10px}
.mrow .btn{flex:1}
.note{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const SESSOES_SEED=[];

const SIMBOLISMO_DESC='Sempre que adquirir este poder, aprenda dois símbolos (pp. 144-147).\nVocê pode ter até (NP + 1) símbolos ativos ao mesmo tempo; se criar mais símbolos além desse limite, antes deve escolher um de seus símbolos ativos para destruir.\nVocê pode fazer a ação Inventário e gastar 2 PI para criar um dos símbolos que aprendeu e escolher um: aplicar esse símbolo em si mesmo; ou aplicar esse símbolo num aliado que você consegue ver; ou fazer um ataque livre usando uma arma equipada. Esse ataque não causa dano, mas você aplica uma cópia do símbolo escolhido a cada inimigo que atingir (cada cópia conta como um símbolo individual para seu limite de (NP + 1) símbolos ativos).';
function migrate(s){
  const v0=s.v||1;
  if(!Array.isArray(s.heroicos)){const x=String(s.heroicos||'').trim();s.heroicos=(x&&!/^(nenhum|—|-)$/i.test(x))?[{nome:'',desc:x}]:[]}
  s.habilidades=s.habilidades||[];s.simbolos=s.simbolos||[];
  // custo/alvos/duração saíram das habilidades: o que existia vira texto na descrição
  s.habilidades.forEach(h=>{
    const x=[];if(h.custo)x.push('Custo: '+h.custo);if(h.alvos)x.push('Alvos: '+h.alvos);if(h.duracao)x.push('Duração: '+h.duracao);
    if(x.length){h.desc=x.join(' · ')+(h.desc?'\n'+h.desc:'')}
    delete h.custo;delete h.alvos;delete h.duracao;
  });
  if(v0<2&&!s.habilidades.some(h=>norm(h.nome)==='simbolismo')){
    const i=s.habilidades.findIndex(h=>norm(h.fonte)==='simbolista');
    s.habilidades.splice(i<0?s.habilidades.length:i,0,{nome:'Simbolismo',fonte:'Simbolista',np:1,desc:SIMBOLISMO_DESC});
  }
  if(v0<3){ // o Símbolo do Renascimento passa a ser um símbolo
    const i=s.habilidades.findIndex(h=>norm(h.nome)==='símbolo do renascimento');
    if(i>=0){const h=s.habilidades.splice(i,1)[0];if(!s.simbolos.some(x=>norm(x.nome)===norm(h.nome)))s.simbolos.push({nome:h.nome,qtd:0,copias:0,desc:h.desc||''})}
  }
  s.simbolos.forEach(x=>{if(!x.id)x.id=newId()});
  (s.armas||[]).forEach(w=>{if(w.maos==null)w.maos=1});
  if(!Array.isArray(s.simControle)){
    const nomes=[s.nome].concat((s.lacos||[]).map(b=>b.nome)).filter(Boolean);
    s.simControle=nomes.map(n=>({nome:n,s:[]}));s.simControle.push({nome:'',s:[]});
  }
  if(v0<5)s.simbolos.forEach(x=>{if(x.qtd==null)x.qtd=x.ativo?1:0;delete x.ativo});
  s.simbolos.forEach(x=>{if(x.qtd==null)x.qtd=0});
  (s.armas||[]).forEach(w=>{if(!PA_OK.includes(w.pa)||!PA_OK.includes(w.pb)||w.pm===undefined)precParse(w);w.pm=num(w.pm)});
  if((s.classes||[]).length)s.nivel=s.classes.reduce((a,c)=>a+num(c.nivel),0);
  if(!s.diarioSeed){const dv=s.diario||[];if(dv.length<=1&&dv.every(e=>!e.titulo&&!e.resumo&&!e.texto)&&SESSOES_SEED.length)s.diario=SESSOES_SEED.map(e=>Object.assign({},e));s.diarioSeed=true}
  (s.diario||[]).forEach(e=>{if(e.resumo===undefined)e.resumo=''});
  (s.classes||[]).forEach(c=>{
    if(c.bpv===undefined&&c.bpm===undefined&&c.bpi===undefined){
      const g=k=>{const r=String(c.ben||'').match(new RegExp('\\+\\s*(\\d+)\\s*'+k+'\\b','i'));return r?parseInt(r[1],10):0};
      c.bpv=g('PV');c.bpm=g('PM');c.bpi=g('PI');
      s.bonus=s.bonus||{};s.bonus.pv=num(s.bonus.pv)-c.bpv;s.bonus.pm=num(s.bonus.pm)-c.bpm;s.bonus.pi=num(s.bonus.pi)-c.bpi;
    }
  });
  s.v=5;
  return s;
}
function precParse(w){
  const m=String(w.prec||'').match(/\[\s*(DES|AST|VIG|VON)\s*\+\s*(DES|AST|VIG|VON)\s*\]\s*([+\-−]\s*\d+)?/i);
  w.pa=m?m[1].toLowerCase():'des';w.pb=m?m[2].toLowerCase():'ast';w.pm=m&&m[3]?parseInt(m[3].replace('−','-').replace(/\s/g,''),10):0;
}
const PA_OK=['des','ast','vig','von'];
function precText(w){const m=num(w.pm);return '['+String(w.pa).toUpperCase()+' + '+String(w.pb).toUpperCase()+']'+(m?' '+(m>0?'+':'−')+Math.abs(m):'')}
function precDice(w,d){const m=num(w.pm);return 'd'+d.dice[w.pa]+' + d'+d.dice[w.pb]+(m?' '+(m>0?'+':'−')+' '+Math.abs(m):'')}
function loadState(o){o.v=o.v||1;return migrate(merge(makeDefault(),o))}
function merge(base,src){ // completa chaves ausentes (fichas antigas ou importadas)
  if(Array.isArray(base)||typeof base!=='object'||base===null) return src===undefined?base:src;
  const out={};
  for(const k of Object.keys(base)) out[k]=(src&&k in src)?merge(base[k],src[k]):clone(base[k]);
  if(src) for(const k of Object.keys(src)) if(!(k in out)) out[k]=src[k];
  return out;
}

let dirty=false,saving=false,saveTimer=null,dbDoc=null,dbReady=false,lastSaved='',syncState='local',DOCK=null;

function setSync(s){syncState=s;const el=$('#syncdot');if(el){el.className=dotCls();el.title=syncLabel()}}
function syncLabel(){if(unsent())return 'Há alterações ainda não enviadas';return {ok:'Sincronizado com a sua conta',wait:'Salvando...',err:'Erro ao sincronizar. Os dados ficam salvos neste aparelho.',local:'Salvo neste aparelho'}[syncState]}
function touch(){
  dirty=true;S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(dbDoc){setSync('wait');clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}

}
async function flush(){
  if(!dbDoc||!dbReady) return;
  if(saving){saveTimer=setTimeout(flush,500);return}
  const str=JSON.stringify(S);
  if(str===lastSaved){dirty=false;setSync('ok');return}
  saving=true;
  try{await dbDoc.set({json:str,t:S.t});lastSaved=str;dirty=false;setSync('ok')}
  catch(e){setSync('err')}
  finally{saving=false}
}
function applyRemote(json){
  try{S=loadState(JSON.parse(json));lastSaved=json;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    render();}catch(e){}
}
async function initCloud(){
  try{
    if(!(window.claude&&window.claude.use)) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbDoc=db.doc('data/users/'+id+'/ficha-lyra');
    let first=true,timer=setTimeout(()=>{if(first)setSync('err')},10000);
    dbDoc.onSnapshot(snap=>{
      const d=snap.exists?snap.data():null;
      if(first){
        first=false;clearTimeout(timer);dbReady=true;
        if(d&&d.json&&num(d.t)>num(S.t)){applyRemote(d.json);setSync('ok');return}
        if(d&&d.json) lastSaved=d.json;
        setSync('wait');flush();return;
      }
      if(d&&d.json&&d.json!==lastSaved&&!dirty&&num(d.t)>num(S.t)){applyRemote(d.json)}
    },()=>setSync('err'));
    setSync('wait');
  }catch(e){setSync('local')}
}

  const data=JSON.stringify(S),base='ficha-'+(S.nome||'personagem').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  let done=false;
  if(temPasta()){
    const h=await getPasta();
    if(h){try{const fh=await h.getFileHandle(base+'.json',{create:true}),w=await fh.createWritable();await w.write(data);await w.close();done=true}catch(e){toastModal('Não consegui salvar na pasta escolhida','Escolha a pasta de novo no menu. O arquivo será baixado normalmente.')}}
  }
  try{
    if(!done&&isMobile()&&navigator.canShare&&navigator.share){
      const f=new File([data],base+'.txt',{type:'text/plain'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Ficha '+(S.nome||'')});done=true}
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  if(!done){
    try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;
      if(dl){await dl.save({filename:base+'.json',data});done=true}}catch(e){if(e&&e.code==='declined')return}
  }

  cfgSet({sentT:S.t,sentAt:Date.now()});renderHeader();if(!$('#modal').hidden)syncModal();
}
/* ---------- sincronia pelo GitHub (repositório privado, API de conteúdo) ---------- */
const ghOk=()=>{const c=cfgGet();return !!(c.ghRepo&&c.ghToken)};
const ghUrl=()=>{const c=cfgGet();return 'https://api.github.com/repos/'+c.ghRepo.replace(/^\/|\/$/g,'')+'/contents/'+(c.ghPath||'ficha.json').split('/').map(encodeURIComponent).join('/')};
const ghHead=()=>({Authorization:'Bearer '+cfgGet().ghToken,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const b64e=s=>{const b=new TextEncoder().encode(s);let r='';b.forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
const b64d=s=>{const r=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(r,c=>c.charCodeAt(0)))};
async function ghGetFile(){
  let r;try{r=await fetch(ghUrl(),{headers:ghHead(),cache:'no-store'})}catch(e){throw new Error('Sem conexão com o GitHub.')}
  if(r.status===404){const j=await r.json().catch(()=>({}));if(/Not Found/i.test(j.message||'')&&!(await ghRepoOk()))throw new Error('Repositório não encontrado, ou o token não tem acesso a ele.');return null}
  if(r.status===401||r.status===403)throw new Error('O GitHub recusou o token. Confira se ele está válido e com permissão de Contents (leitura e escrita) neste repositório.');
  if(!r.ok)throw new Error('GitHub respondeu '+r.status+'.');
  const j=await r.json();return{sha:j.sha,text:b64d(j.content)};
}
async function ghRepoOk(){try{const r=await fetch('https://api.github.com/repos/'+cfgGet().ghRepo.replace(/^\/|\/$/g,''),{headers:ghHead()});return r.ok}catch(e){return false}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function ghPutLocal(){
  /* grava a ficha deste aparelho; se o GitHub avisar que o arquivo mudou (409/422), busca a versão atual e tenta de novo */
  for(let tent=0;tent<4;tent++){
    const cur=await ghGetFile();
    const body={message:'Ficha '+(S.nome||'')+' · '+new Date().toLocaleString('pt-BR'),content:b64e(JSON.stringify(S)),...(cur?{sha:cur.sha}:{})};
    const r=await fetch(ghUrl(),{method:'PUT',headers:{...ghHead(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){await sleep(500*(tent+1));continue}
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(r.status===401||r.status===403?'O GitHub recusou o envio. O token precisa de permissão de escrita em Contents.':'Falha ao enviar ('+r.status+'). '+(j.message||''))}
    return;
  }
  throw new Error('O arquivo no GitHub está sendo alterado por outro aparelho. Tente de novo em alguns segundos.');
}
async function ghSend(){
  if(!ghOk()){toastModal('Configure o GitHub','Preencha o repositório e o token no menu.');return}
  while(ghBusy)await sleep(200);
  ghBusy=true;
  try{await ghPutLocal();cfgSet({sentT:S.t,sentAt:Date.now(),ghAt:Date.now()});setSync('ok');renderHeader();toastModal('Enviado ao GitHub','A ficha foi salva em '+esc(cfgGet().ghRepo)+'.')}
  catch(e){setSync('err');toastModal('Não consegui enviar',esc(e.message))}
  finally{ghBusy=false}
}
async function ghFetch(){
  if(!ghOk()){toastModal('Configure o GitHub','Preencha o repositório e o token no menu.');return}
  try{const cur=await ghGetFile();if(!cur){toastModal('Nada no GitHub ainda','Ainda não há ficha salva neste repositório. Use Enviar primeiro.');return}importJson(cur.text)}
  catch(e){toastModal('Não consegui buscar',esc(e.message))}
}
/* sincronia automática: vale a ficha com o carimbo de tempo mais recente (a outra é sobrescrita) */
let ghTimer=null,ghBusy=false,ghAgain=false;
const ghAuto=()=>ghOk()&&cfgGet().ghAuto!==false;
const ghDelay=()=>{const v=Number(cfgGet().ghDelay);return v>=1&&v<=600?v:3};
const ghPoll=()=>{const v=Number(cfgGet().ghPoll);return v===0?0:(v>=10&&v<=3600?v:60)};
let ghDirty=false;
function ghQueue(){if(!ghAuto())return;ghDirty=true;clearTimeout(ghTimer);ghTimer=setTimeout(()=>ghSync(),ghDelay()*1000)}
function ghEditing(){const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}
async function ghSync(){
  if(!ghAuto())return;
  if(ghBusy){ghAgain=true;return}
  ghBusy=true;
  try{
    for(let tent=0;tent<2;tent++){
      const cur=await ghGetFile();let rt=0,ro=null;
      if(cur){try{ro=JSON.parse(cur.text);rt=num(ro.t)}catch(e){}}
      if(ro&&ro.attr&&ro.classes&&rt>num(S.t)){
        if(ghEditing()){break}
        S=loadState(ro);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        cfgSet({sentT:S.t,ghAt:Date.now()});render();setSync('ok');break;
      }
      if(!cur||rt<num(S.t)){
        await ghPutLocal();
        cfgSet({sentT:S.t,sentAt:Date.now(),ghAt:Date.now()});setSync('ok');renderHeader();ghDirty=false;
      }else{cfgSet({sentT:S.t});ghDirty=false}
      break;
    }
  }catch(e){setSync('err');window.GHERR=e.message}
  finally{ghBusy=false;if(ghAgain){ghAgain=false;ghQueue()}}
}

/* ---------- derivados ---------- */
function derive(){
  const d={dice:{},pen:{}};
  for(const [k] of ATTRS){
    let p=0; for(const [sk,sv] of Object.entries(STATUS)) if(S.status[sk]&&sv.a.includes(k)) p++;
    d.pen[k]=p; d.dice[k]=Math.max(6,num(S.attr[k])-2*p)+num(S.attrBonus[k]);
  }
  if(S.classes.length)S.nivel=S.classes.reduce((a,c)=>a+num(c.nivel),0);
  const lvl=num(S.nivel);
  const cb=k=>S.classes.reduce((a,c)=>a+num(c[k]),0);
  d.pvMax=5*num(S.attr.vig)+lvl+num(S.bonus.pv)+cb('bpv');
  d.pmMax=5*num(S.attr.von)+lvl+num(S.bonus.pm)+cb('bpm');
  d.piMax=6+num(S.bonus.pi)+cb('bpi');
  d.crise=Math.floor(d.pvMax/2);
  d.pvDano=clamp(num(S.pvDano),0,d.pvMax); d.pmGasto=clamp(num(S.pmGasto),0,d.pmMax); d.piGasto=clamp(num(S.piGasto),0,d.piMax);
  d.pv=d.pvMax-d.pvDano; d.pm=d.pmMax-d.pmGasto; d.pi=d.piMax-d.piGasto;
  const A=S.armadura.equip?S.armadura:null, E=S.escudo.equip?S.escudo:null;
  const baseDef=(A&&A.defFixa)?num(A.def):Math.min(12,d.dice.des)+(A?num(A.def):0);
  d.def=baseDef+(E?num(E.def):0)+num(S.bonus.def);
  const baseM=(A&&A.defmFixa)?num(A.defm):Math.min(12,d.dice.ast)+(A?num(A.defm):0);
  d.defm=baseM+(E?num(E.defm):0)+num(S.bonus.defm);
  d.init=num(S.initMod)+(A?num(A.init):0)+(E?num(E.init):0);
  d.maos=(S.armas||[]).reduce((a,w)=>a+(w.equip?num(w.maos)||1:0),0)+(S.escudo.equip?1:0);
  d.clsSum=S.classes.reduce((a,c)=>a+num(c.nivel),0);
  d.xpNeeded=10;
  return d;
}

/* ---------- aba Habilidades (cartas + Magicanto) ---------- */
function substScale(text,esc_){
  if(!esc_) return text;
  return text.replace(/\(?\brecupera[çc][ãa]o da escala\)?/gi,esc_.rec).replace(/\(?\btipo da escala\)?/gi,esc_.tipo).replace(/\(?\batributo da escala\)?/gi,esc_.attr).replace(/\bcondição da escala\b/gi,esc_.cond);
}
function tomCalc(tom,esc){
  const m=/(?:(\d+)\s*\+\s*)?o dobro de seu dado (?:atual )?de Vontade/i.exec(tom.desc||'');
  if(!m) return '';
  const lv=num(S.nivel),b=lv>=40?20:lv>=20?10:0,die=derive().dice.von,fixo=num(m[1]),base=fixo+2*die,tot=base+b;
  const un=/recupera/i.test(tom.desc)?esc.rec:/dano/i.test(tom.desc)?'de dano '+esc.tipo:'';
  return `<p class="npv">Cálculo: ${fixo?fixo+' + ':''}2 × d${die} (${2*die})${b?' + '+b+' (nível '+lv+')':''} = <b>${tot}</b> ${esc_(un)}</p>`;
}
function magicOut(){
  const m=S.mc,tom=m.tons[m.sel.tom],vol=m.volumes[m.sel.vol],esc=m.escalas[m.sel.esc];
  if(!tom||!tom.nome||!vol||!esc) return '<p class="empty">Escolha tom, volume e escala.</p>';
  const lv=num(S.nivel),bonus=lv>=40?20:lv>=20?10:0;
  return `<div class="out"><div class="row" style="justify-content:space-between"><div><span class="lbl">Custo</span><div class="cost num">${num(vol.custo)} PM</div></div><button class="btn pri" data-act="cast">Cantar</button></div>
    <p><b class="k">Alvos:</b> ${esc_(vol.alvos)}</p>
    <p><b class="k">Escala ${esc_(esc.nome)}:</b> ${esc_(esc.tipo)}, condição ${esc_(esc.cond)}, atributo ${esc_(esc.attr)}, recuperação ${esc_(esc.rec)}</p>
    <p><b class="k">${esc_(tom.nome)}:</b> ${esc_(substScale(tom.desc,esc))}</p>${tomCalc(tom,esc)}
    <p class="note">Bônus de nível aplicado aos tons: +${bonus}. Duração: ${esc_(tom.duracao||'até o fim do turno')}</p></div>`;
}
function simModalHtml(){const d=derive();return `<div id="simmodal"><div class="mtop"><h2>Controle de símbolos</h2><span class="tag">PI ${d.pi} / ${d.piMax}</span><button class="btn sm" data-act="closeSim">Fechar</button></div>${simControleHtml()}</div>`}
function simIdx(){return S.classes.findIndex(c=>normK(c.nome)==='simbolista')}
function magicoConflito(){

/* ---------- NP nas habilidades: valor calculado sem esconder a fórmula ---------- */
function npPoder(h){const c=S.classes.find(c=>normK(c.nome)===normK(h.fonte));return c?c.poderes.find(p=>normK(p.nome)===normK(h.nome)):null}
function npAbil(h){const p=npPoder(h);return p?num(p.np):num(h.np)}
const NP_RE=/\bNP\b(?:\s*([×x*+\-−])\s*(\d+))?/g;
function npVal(op,k,n){k=num(k);return op==='+'?n+k:(op==='-'||op==='−')?n-k:n*k}
function npHtml(h){
  const n=npAbil(h);
  return esc(h.desc||'').replace(NP_RE,(m,op,k)=>op?`<span class="npv">${m} <b>= ${npVal(op,k,n)}</b></span>`:`<span class="npv">${m} <b>(${n})</b></span>`);
}
function npResumo(h){
  const n=npAbil(h),seen=new Set(),out=[];
  String(h.desc||'').replace(NP_RE,(m,op,k)=>{if(op&&!seen.has(m)){seen.add(m);out.push(`<span class="tag npchip">${esc(m)} = <b>${npVal(op,k,n)}</b></span>`)}return m});
  const usa=/\bNP\b/.test(String(h.desc||''));
  return usa?`<div class="npbox"><span class="tag npchip">NP <b>${n}</b></span>${out.join('')}</div>`:'';
}
function cardHtml(h,i){return `<div class="item"><div class="top">${inp(`habilidades.${i}.nome`,{cls:'grow',ph:'Habilidade'})}${inp(`habilidades.${i}.fonte`,{cls:'grow',ph:'Origem (classe)'})}<span class="lbl">NP</span>${npPoder(h)?`<span class="tag" title="NP vem do poder, na aba Ficha">${num(npPoder(h).np)}</span>`:stepper(`habilidades.${i}.np`,0,20)}${tgl(`habilidades.${i}.combate`,'Conflito')}<button class="btn ico sm bad" data-act="del" data-l="habilidades" data-i="${i}" aria-label="Remover">×</button></div>
    <div style="margin-top:8px">${ta(`habilidades.${i}.desc`,{rows:3,ph:'Descrição'})}</div>${npResumo(h)}</div>`}
function simNP(){
  const c=S.classes.find(c=>norm(c.nome)==='simbolista');
  const p=c&&c.poderes.find(p=>norm(p.nome)==='simbolismo');
  if(p) return num(p.np);
  const h=S.habilidades.find(h=>norm(h.nome)==='simbolismo');return h?num(h.np):0;
}

    <span class="tag ${n?'ok':''}">Em jogo: ${n}</span><button class="btn ico sm bad" data-act="del" data-l="simbolos" data-i="${i}" aria-label="Remover símbolo">×</button></div>

}

const RES={
  pv:{n:'Pontos de Vida',k:'pvDano',max:d=>d.pvMax,minus:'Dano',plus:'Cura'},
  pm:{n:'Pontos de Mana',k:'pmGasto',max:d=>d.pmMax,minus:'Gastar',plus:'Recuperar'},
  pi:{n:'Pontos de Inventário',k:'piGasto',max:d=>d.piMax,minus:'Gastar',plus:'Recuperar'},

let RESKEY=null;
function resModal(k){
  RESKEY=k;const R=RES[k],d=derive();
  const cur=k==='zen'?num(S.zenites):d[k], max=k==='zen'?null:R.max(d);
  showModal(`<h2>${R.n}</h2><div class="big num">${fmt(cur)}${max!=null?`<small style="font-size:18px;color:var(--muted)"> / ${max}</small>`:''}</div>
    ${k==='pv'?`<p class="note" style="text-align:center">Crise em ${d.crise} PV ou menos</p>`:''}
    <div class="resform">
      <label class="rf bad"><span>${R.minus}</span><input class="f" id="resMinus" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="${R.minus}"><button class="btn bad" data-act="resapply" data-s="-1" data-f="resMinus">${R.minus}</button></label>
      <label class="rf ok"><span>${R.plus}</span><input class="f" id="resPlus" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="${R.plus}"><button class="btn pri" data-act="resapply" data-s="1" data-f="resPlus">${R.plus}</button></label>
    </div>
    <div class="mrow"><button class="btn" data-act="closeModal">Fechar</button></div>`);
  const f=$('#resMinus');if(f)setTimeout(()=>f.focus(),50);
}
function applyDelta(k,delta,quiet){
  const d=derive();
  if(k==='zen'){S.zenites=Math.max(0,num(S.zenites)+delta)}
  else{const R=RES[k],mx=R.max(d);S[R.k]=clamp(num(S[R.k])-delta,0,mx)}
  touch();renderHeader();if(!quiet)resModal(k);if(TAB==='ficha'||TAB==='combate')renderView();
}

/* ---------- conferência de escolhas ligadas ao NP (Simbolismo e Magicanto) ---------- */
function npDe(nome){let n=0;S.classes.forEach(c=>c.poderes.forEach(p=>{if(normK(p.nome)===normK(nome))n+=num(p.np)}));return n}
function pendSimbolos(){const np=npDe('Simbolismo'),esp=2*np,tem=S.simbolos.filter(x=>x.nome).length;return {np,esp,tem,dif:esp-tem}}
function pendMagicanto(){const np=npDe('Magicanto'),esp=np>0?np+1:0,esc=S.mc.escalas.filter(e=>e.on).length,tons=S.mc.tons.filter(x=>x.nome).length,tem=esc+tons;
  let dif=esp-tem,falta='';if(np>0&&dif<=0){if(esc<1)falta='Falta ao menos uma escala.';else if(tons<1)falta='Falta ao menos um tom.'}
  return {np,esp,esc,tons,tem,dif,falta}}
function pendTag(p,what){
  if(!p.np) return '';
  const msg=p.dif>0?`Faltam ${p.dif} ${what}`:p.dif<0?`${-p.dif} ${what} a mais`:(p.falta||'Escolhas conferem');
  const cls=(p.dif!==0||p.falta)?'warn':'ok';
  return `<span class="tag ${cls}" title="Esperado pelo NP ${p.np}: ${p.esp}">${msg}</span>`}
function catEntrada(classe,poder){const l=CATALOGO[normK(classe)];return l?l.find(e=>normK(e.nome)===normK(poder)):null}
// Chamado quando o nome de um poder é confirmado: completa o poder e cria a habilidade, se ainda não existir.
function catAplicar(ci,pj){
  const c=S.classes[ci],p=c&&c.poderes[pj]; if(!p) return false;
  const e=catEntrada(c.nome,p.nome); if(!e) return false;
  p.nome=e.nome; if(!num(p.max)&&e.max) p.max=e.max;
  const ja=S.habilidades.some(h=>normK(h.nome)===normK(e.nome)&&normK(h.fonte)===normK(c.nome));
  if(ja) return false;
  S.habilidades.push({nome:e.nome,fonte:c.nome,np:Math.max(1,num(p.np)),combate:false,desc:e.desc});
  return true;
}

  refSimbolos:()=>showModal(`<div class="mtop"><h2>Regras dos símbolos</h2><button class="btn sm" data-act="closeModal">Fechar</button></div>
    <p class="note" style="margin:0 0 8px">Símbolos seguem algumas regras especiais.</p>
    <ul class="reflist">${['Uma criatura só pode <b>estar com um símbolo por vez</b>. Se receber um novo símbolo, independentemente da fonte, o símbolo anterior é destruído.','Símbolos têm <b>efeito e duração ilimitados</b> até que sejam destruídos.','Se um simbolista morrer, cada símbolo que ele criou é <b>destruído automática e imediatamente</b>.','Se uma criatura que está com um símbolo morrer, o símbolo também é destruído. Mas, se a criatura for um NPC que apenas mudou de forma ou estatísticas ao ficar com 0 PV, isso não remove o símbolo. Em resumo: símbolos são vinculados “narrativamente” ao personagem, não a seus parâmetros e manifestação atual.','Durante uma cena do mestre, um vilão pode gastar <b>1 Ponto de Ultima</b> para destruir qualquer quantidade de símbolos vinculados a ele e aos seus aliados presentes na cena. Essa é a única maneira de remover um símbolo contra a vontade do simbolista que o criou, exceto pelo gasto de uma oportunidade apropriada à cena ou com um poder de NPC criado pelo mestre (mas isso não deve ser feito mais de duas ou três vezes por campanha).','Um simbolista pode <b>destruir quantos símbolos quiser</b> a qualquer momento, sem precisar usar qualquer tipo de ação.','Se um símbolo exigir que você faça uma escolha ao ser criado, a escolha se aplica a todas as cópias criadas pela mesma ação (mas não afeta cópias criadas por outras ações).'].map(x=>`<li>${x}</li>`).join('')}</ul>
    <h3>Exemplo</h3><p style="margin:0">Se um simbolista aplicar dois símbolos de fraqueza (fogo) ao usar o poder Simbolismo combinado com um ataque com a propriedade <b>multi (2)</b>, as criaturas que receberem esses símbolos sofrerão dano adicional de fogo. Se, logo em seguida, aplicar um símbolo de fraqueza (raio) numa terceira criatura, as duas anteriores continuam sofrendo dano adicional de fogo, não de raio.</p>
    <p class="note" style="margin-top:10px"><b>Lembre-se:</b> o número máximo de símbolos ativos ao mesmo tempo é definido pelo seu Nível de Poder em Simbolismo (NP + 1).</p>`,'wide'),
  refItens:()=>showModal(`<div class="mtop"><h2>Itens e Pontos de Inventário</h2><button class="btn sm" data-act="closeModal">Fechar</button></div>${itensCard().replace(/^<section class="card"><h2>[^<]*<\/h2>/,'').replace(/<\/section>$/,'')}`,'wide'),
  okConfirm:()=>{const f=CONFIRM;CONFIRM=null;closeModal();if(f)f()},
  closeDock:()=>{$('#dock').hidden=true},
  pf:el=>{S.pf=Math.max(0,num(S.pf)+num(el.dataset.d));touch();renderHeader()},
  dieStep:el=>{const k=el.dataset.k,dir=num(el.dataset.d),nd=derive().dice[k]+2*dir;if(nd<6||nd>12)return;S.attrBonus[k]=num(S.attrBonus[k])+2*dir;commit()},
  step:el=>{const p=el.dataset.p,ant=num(getP(p)),v=clamp(ant+num(el.dataset.d),num(el.dataset.min),num(el.dataset.max));setP(p,v);commit();
    const mp=p.match(/^classes\.(\d+)\.poderes\.(\d+)\.np$/);
    if(mp&&v>ant){const pw=S.classes[num(mp[1])].poderes[num(mp[2])],k=normK(pw.nome);
      if(k==='simbolismo')toastModal('Simbolismo NP '+v,'Aprenda mais <b>dois símbolos</b> (botão <b>+ Símbolo</b> na aba Simbolista). Total esperado: <b>'+(2*npDe('Simbolismo'))+'</b> símbolos.');
      else if(k==='magicanto')toastModal('Magicanto NP '+v,'Aprenda mais <b>uma escala ou um tom</b>, à sua escolha (aba Virtuoso). Total esperado: <b>'+(npDe('Magicanto')+1)+'</b> escolhas entre escalas e tons.')}},
  status:el=>{S.status[el.dataset.k]=!S.status[el.dataset.k];commit()},
  bond:el=>{const b=S.lacos[num(el.dataset.i)],k=el.dataset.k,v=el.dataset.v;b[k]=b[k]===v?'':v;commit()},
  add:el=>{const p=el.dataset.l;const arr=getP(p);arr.push(LISTS[listKey(p)]());commit()},
  addHab:el=>{const h=LISTS.habilidades();h.fonte=el.dataset.f||'';S.habilidades.push(h);commit()},
  simToggle:el=>{
    const r=S.simControle[num(el.dataset.i)],id=el.dataset.id,x=S.simbolos.find(x=>x.id===id);r.s=r.s||[];
    const k=r.s.indexOf(id),who=r.nome||'este alvo',nm=(x&&x.nome)||'símbolo';
    if(k>=0){askConfirm('Destruir o símbolo '+nm+' em '+who+'?',()=>{r.s.splice(r.s.indexOf(id),1);commit()},'Destruir');return}
    const lim=simNP()+1,d=derive(),custo=2;
    if(r.s.length>=1){toastModal('Um símbolo por alvo',who+' já tem o símbolo '+((S.simbolos.find(x=>x.id===r.s[0])||{}).nome||'ativo')+'. Cada alvo só pode ter 1 símbolo: destrua o atual antes de criar outro.');return}
    if(simAtivos()+1>lim){toastModal('Limite de símbolos','Você já tem '+simAtivos()+' de '+lim+' símbolos ativos. Destrua um símbolo antes de criar outro.');return}
    if(d.pi<custo){toastModal('PI insuficientes','Criar um símbolo custa 2 PI e você tem '+d.pi+'.');return}
    askConfirm('Criar '+nm+' em '+who+' por 2 PI?',()=>{r.s.push(id);S.piGasto=num(S.piGasto)+custo;commit()},'Criar');
  },
  addDiario:()=>{S.diario.push({data:today(),titulo:'',resumo:'',texto:''});commit()},
  del:el=>{const p=el.dataset.l,i=num(el.dataset.i),arr=getP(p);askConfirm('Remover este item?',()=>{
    const mc=p.match(/^classes\.(\d+)\.poderes$/);let hab=null;
    if(mc){const c=S.classes[num(mc[1])],pw=arr[i],e=c&&pw&&catEntrada(c.nome,pw.nome);if(e)hab=S.habilidades.find(h=>normK(h.nome)===normK(e.nome)&&normK(h.fonte)===normK(c.nome))}
    arr.splice(i,1);commit();
    if(hab)askConfirm('Remover também a habilidade "'+hab.nome+'" da aba da classe?',()=>{const k=S.habilidades.indexOf(hab);if(k>=0){S.habilidades.splice(k,1);commit()}},'Remover habilidade')},'Remover')},
  tomPick:()=>{
    const tem=S.mc.tons.map(x=>normK(x.nome)),rest=TONS_CAT.map((x,i)=>({x,i})).filter(o=>!tem.includes(normK(o.x.nome)));
    showModal(`<div class="mtop"><h2>Adicionar tom</h2><button class="btn sm" data-act="closeModal">Fechar</button></div>
      <p class="note" style="margin:0 0 8px">Escolha um tom do Virtuoso. O texto entra pronto e pode ser editado depois.</p>
      <div class="tompick">${rest.map(o=>`<button class="item tombtn" data-act="tomAdd" data-i="${o.i}"><b>${esc(o.x.nome)}</b><span>${esc(o.x.desc.split('\n')[0])}</span></button>`).join('')||'<p class="empty">Você já tem todos os tons da lista.</p>'}
      <button class="item tombtn" data-act="tomAdd" data-i="-1"><b>Tom em branco</b><span>Para um tom que não está na lista.</span></button></div>`,'wide')},
  tomAdd:el=>{
    const i=num(el.dataset.i),e=i>=0?TONS_CAT[i]:{nome:'',duracao:'',desc:''},tons=S.mc.tons;
    const livre=tons.findIndex(x=>!x.nome&&!x.desc);
    if(livre>=0)tons[livre]={nome:e.nome,duracao:e.duracao,desc:e.desc};else tons.push({nome:e.nome,duracao:e.duracao,desc:e.desc});
    closeModal();commit()},
  cast:()=>{
    const m=S.mc,tom=m.tons[m.sel.tom],vol=m.volumes[m.sel.vol],esc=m.escalas[m.sel.esc],d=derive(),c=num(vol.custo);
    if(c>d.pm){toastModal('PM insuficientes','Você tem '+d.pm+' PM e este canto custa '+c+'.');return}
    askConfirm('Cantar '+tom.nome+' ('+vol.nome+', escala '+esc.nome+') por '+c+' PM?',()=>{S.pmGasto=num(S.pmGasto)+c;touch();render();const r={label:'Canto: '+tom.nome+' · '+vol.nome+' · '+esc.nome,dice:[],text:'Gastou '+c+' PM. Restam '+(d.pm-c)+'.'};showDock(r);},'Cantar');
  },
  equipToggle:el=>{setP(el.dataset.p,!getP(el.dataset.p));commit()},
  menu:()=>menuModal(),
  syncMenu:()=>syncModal(),
  sendDrive:()=>sendToDrive(),
  ghSend:()=>ghSend(),
  ghFetch:()=>ghFetch(),
  rest:()=>askConfirm('Restaurar PV, PM e PI ao máximo e remover todas as condições?',()=>{S.pvDano=0;S.pmGasto=0;S.piGasto=0;Object.keys(S.status).forEach(k=>S.status[k]=false);commit()},'Descansar'),
  export:async()=>{ if(true){await sendToDrive();return}
    const data=JSON.stringify(S,null,1),name='ficha-'+(S.nome||'personagem').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json';
    try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;
      if(dl){await dl.save({filename:name,data});return}}catch(e){if(e&&e.code==='declined')return}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){ACT.copyJson()}
  },
  copyJson:async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toastModal('Copiado','O backup está na área de transferência. Cole em um arquivo de texto para guardar.')}catch(e){showModal(`<h2>Copie manualmente</h2><textarea class="f" id="jsonBox" rows="8" readonly>${esc(JSON.stringify(S))}</textarea><div class="mrow"><button class="btn pri" data-act="closeModal">Ok</button></div>`);setTimeout(()=>{const b=$('#jsonBox');b&&b.select()},50)}},
  importFile:async()=>{
    if(temPasta()&&window.showOpenFilePicker&&cfgGet().dirName){try{const h=await getPasta();const [fh]=await showOpenFilePicker({startIn:h||undefined,types:[{description:'Backup da ficha',accept:{'application/json':['.json'],'text/plain':['.txt']}}]});importJson(await (await fh.getFile()).text());return}catch(e){if(e&&e.name==='AbortError')return}}
    $('#fileJson').click()},
  pickDir:async()=>{try{const h=await showDirectoryPicker({mode:'readwrite',id:'lyra-ficha'});await idbSet('dir',h);cfgSet({dirName:h.name});syncModal()}catch(e){if(!e||e.name!=='AbortError')toastModal('Não foi possível escolher a pasta','Este navegador ou esta janela bloqueou o acesso. O envio continua indo para os downloads.')}},
  clearDir:async()=>{try{await idbDel('dir')}catch(e){}cfgSet({dirName:''});syncModal()},
  importPaste:()=>showModal(`<h2>Importar backup</h2><textarea class="f" id="jsonBox" rows="8" placeholder="Cole aqui o texto do backup"></textarea><div class="mrow"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="doPaste">Importar</button></div>`),
  doPaste:()=>importJson($('#jsonBox').value),
  blank:()=>askConfirm('Começar uma ficha em branco? As alterações atuais serão perdidas. Faça um backup antes se precisar.',()=>{S=makeBlank();commit()},'Começar'),
  portrait:()=>$('#fileImg').click(),
  simImgPick:el=>{const i=num(el.dataset.i),x=S.simbolos[i];if(!x)return;window.SYMIDX=i;
    showModal(`<h2>Imagem de ${esc(x.nome||'símbolo')}</h2><div class="tokgrid">${Object.keys(TOKEN_NAMES).map(k=>`<button data-act="simImgSet" data-v="tok:${k}"><img class="tok" src="${TOKENS[k]}" alt="" width="56" height="56">${TOKEN_NAMES[k]}</button>`).join('')}</div>
    <div class="mrow" style="flex-wrap:wrap"><button class="btn" data-act="simImgUpload">Enviar outra imagem</button><button class="btn" data-act="simImgSet" data-v="none">Sem imagem</button><button class="btn" data-act="simImgSet" data-v="">Automática</button><button class="btn pri" data-act="closeModal">Fechar</button></div>`)},
  simImgSet:el=>{const x=S.simbolos[window.SYMIDX];if(!x)return;const v=el.dataset.v;x.img=v==='none'?'tok:':v;closeModal();commit()},
  simImgUpload:()=>$('#fileSym').click()
};
function importJson(txt){
  let o;try{o=JSON.parse(txt);if(!o||typeof o!=='object'||!o.attr||!o.classes) throw 0}catch(e){toastModal('Arquivo inválido','Esse arquivo não é um backup desta ficha.');return}
  const go=()=>{S=loadState(o);touch();cfgSet({sentT:S.t});render();closeModal();toastModal('Ficha carregada','Backup de '+fmtDate(o.t)+' carregado.')};
  if(num(o.t)<num(S.t)&&!window.claude)askConfirm('Este backup ('+fmtDate(o.t)+') é mais antigo que a ficha deste aparelho ('+fmtDate(S.t)+'). Substituir mesmo assim?',go,'Substituir');else go();
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el)}return}
  if(e.target.id==='modal') closeModal();
});
document.addEventListener('input',e=>{
  const el=e.target,p=el.dataset&&el.dataset.b;
  if(!p||el.type==='checkbox'||el.tagName==='SELECT') return;
  let v=el.value; if(el.dataset.t==='num') v=v===''?0:Number(v);
  setP(p,v);if(el.tagName==='TEXTAREA')grow(el);
  touch();renderHeader();updateCalcs();
});
document.addEventListener('change',e=>{
  const el=e.target,p=el.dataset&&el.dataset.b;
  if(el.id==='ghDelay'||el.id==='ghPoll'){cfgSet({[el.id]:Number(el.value)});if(el.id==='ghPoll')ghSchedulePoll();return}
  if(el.id==='ghAuto'){cfgSet({ghAuto:el.checked});if(el.checked)ghSync();return}
  if(el.id==='ghRepo'||el.id==='ghToken'||el.id==='ghPath'){cfgSet({[el.id]:el.value.trim()});if(ghAuto())ghSync();return}
  if(el.id==='fileJson'){const f=el.files[0];if(f){f.text().then(importJson)}el.value='';return}
  if(el.id==='fileSym'){const f=el.files[0],x=S.simbolos[window.SYMIDX];if(f&&x)loadSymImg(f,x);el.value='';return}
  if(el.id==='fileImg'){const f=el.files[0];if(f)loadPortrait(f);el.value='';return}
  if(!p) return;
  let v=el.type==='checkbox'?el.checked:el.value; if(el.dataset.t==='num') v=Number(v);
  setP(p,v);touch();
  const mp=p.match(/^classes\.(\d+)\.poderes\.(\d+)\.nome$/);
  if(mp){const novo=catAplicar(num(mp[1]),num(mp[2]));render();if(novo){const c=S.classes[num(mp[1])];toastModal('Habilidade adicionada','A habilidade <b>'+esc(c.poderes[num(mp[2])].nome)+'</b> foi adicionada à aba '+esc(c.nome)+'.')}return}
  if(window.MAGMODAL&&p.startsWith('mc.sel.')){showModal(magModalHtml(),'wide');render();return}
  if(el.dataset.r){render()}else{renderHeader();updateCalcs()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(getTabs().some(t=>t[0]===h)&&h!==TAB){TAB=h;renderTabs();renderView()}});
window.addEventListener('resize',()=>{document.documentElement.style.setProperty('--hh',$('#top').offsetHeight+'px');document.documentElement.style.setProperty('--th',($('#tabs')?$('#tabs').offsetHeight:46)+'px')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)flush()});

function loadSymImg(file,x){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const n=160,c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d'),s=Math.min(img.width,img.height);g.beginPath();g.arc(n/2,n/2,n/2,0,7);g.clip();g.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,n,n);x.img=c.toDataURL('image/webp',.85);URL.revokeObjectURL(url);closeModal();commit()};
  img.src=url;
}
function loadPortrait(file){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const w=420,h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);S.retrato=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(url);commit()};
  img.src=url;
}
function grow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px'}
function updateCalcs(){/* os valores derivados do corpo são recalculados na renderização do cabeçalho e das abas */
  if(TAB==='ficha'||TAB==='equipamento'||TAB==='acampamento'){const y=window.scrollY;const ae=document.activeElement;
    if(!(ae&&ae.dataset&&ae.dataset.b&&ae.tagName!=='SELECT')) return;}
  const defs=$$('.dt b');if(defs.length&&TAB==='ficha'){const d=derive();defs[0].textContent=d.def;defs[1].textContent=d.defm;defs[2].textContent=(d.init>0?'+':'')+d.init;defs[3].textContent=d.crise;}
}
function renderView(){
  fixTab();const f=TAB.startsWith('cls-')?()=>tabClass(TAB):{ficha:tabFicha,equipamento:tabEquip,combate:tabCombate,acampamento:tabAcamp,referencias:tabRef,diario:tabDiario}[TAB];
  $('#view').innerHTML=f();document.documentElement.style.setProperty('--hh',$('#top').offsetHeight+'px');document.documentElement.style.setProperty('--th',$('#tabs').offsetHeight+'px');$$('#view textarea').forEach(grow);
}
function render(){renderHeader();renderTabs();renderView()}

render();
initCloud();
if(ghAuto())ghSync();
let ghPollT=null;
function ghSchedulePoll(){clearTimeout(ghPollT);const s=ghPoll();if(!s)return;ghPollT=setTimeout(()=>{if(!document.hidden&&ghAuto())ghSync();ghSchedulePoll()},s*1000)}
ghSchedulePoll();
document.addEventListener('visibilitychange',()=>{if(!ghAuto())return;if(document.hidden){if(ghDirty){clearTimeout(ghTimer);ghSync()}}else ghSync()});
window.addEventListener('pagehide',()=>{if(ghAuto()&&ghDirty){clearTimeout(ghTimer);ghSync()}});
try{if(!window.claude&&navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if(!window.claude&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
</body>
</html>
